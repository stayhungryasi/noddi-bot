name: noddi-watch

on:
  schedule:
    - cron: "2-59/5 * * * *"  # 5분마다(매시 2,7,12분…). 정각 혼잡을 피해 지연을 줄임
  workflow_dispatch:         # Actions 탭에서 수동 실행

permissions:
  contents: write            # state.json / archive 커밋용

concurrency:
  group: noddi-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 워뇨띠 새 글 점검
        run: python noddi_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 감시 갤러리 추가: 갤러리ID:종류(g/m/mini):표시이름, 쉼표로 구분
          GALLERIES: "kospi:m:코스피갤,bitcoins_new1:g:비트코인갤"

      - name: 상태 저장
        if: always()
        run: |
          git config user.name "noddi-bot"
          git config user.email "noddi-bot@users.noreply.github.com"
          [ -f state.json ] && git add state.json
          [ -d archive ] && git add archive
          true
          if ! git diff --cached --quiet; then
            git commit -m "noddi: state $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash || true
            git push
          fi
